; ============================================================
; BAI THUC HANH 7 - GIAI DOAN 3
; Mo ta: Web GUI nang cao - WiFiManager, JSON Protocol, Pose Save
; Phan cung: ESP32 DevKit V1 + PCA9685 + 6 Servo
; Diem moi so voi giai doan 2:
;   - WiFiManager: cau hinh WiFi qua Captive Portal (khong hardcode)
;   - Giao thuc WebSocket nang cap len JSON
;   - Pose Save/Load: luu toi da 5 tu the vao NVS (Preferences)
;   - Auto-reconnect WebSocket tu phia JS client
; ============================================================

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
upload_speed      = 921600
monitor_speed     = 115200
upload_port       = COM9      ; <-- DOI THANH COM PORT THUC TE CUA BAN

board_build.partitions = min_spiffs.csv

lib_deps =
    esphome/AsyncTCP
    ottowinter/ESPAsyncWebServer-esphome
    adafruit/Adafruit PWM Servo Driver Library
    tzapu/WiFiManager                         ; Quan ly WiFi qua Captive Portal
    bblanchon/ArduinoJson                     ; Parse/Serialize JSON

; === HUONG DAN SU DUNG GIAI DOAN 3 ===
; Lan dau su dung (chua co WiFi da luu):
;   1. ESP32 khoi dong → bat AP ten "RobotArm-Config"
;   2. Ket noi dien thoai/may tinh vao AP nay
;   3. Mo browser → 192.168.4.1 → nhap SSID va Password WiFi
;   4. ESP32 tu ket noi WiFi va luu credentials vao flash
; Lan sau: ESP32 tu ket noi WiFi ma khong can cau hinh lai.
; Reset credentials: giu nut BOOT (GPIO0) > 3 giay khi khoi dong.
