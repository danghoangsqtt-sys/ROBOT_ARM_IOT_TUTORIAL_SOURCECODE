; ============================================================
; LAB 7 - STAGE 2
; Description: Web Send day du 6 Joint - SPIFFS + WebSocket plain-text
; Hardware: ESP32 DevKit V1 + PCA9685 + 6 Servo
; Protocol: WebSocket plain-text (M/A/H/T/S/W)
; New features so voi STAGE 1:
;   - File web (HTML/JS/CSS) Save trong SPIFFS (Flash filesystem)
;   - Ho tro day du 6 Joint (M, A, H, T, S, W)
;   - Module separated code: servo_ctrl.h, ws_handler.h
; ============================================================

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
upload_speed      = 921600
monitor_speed     = 115200
upload_port       = COM9      ; <-- DOI THANH COM PORT THUC TE CUA BAN

; Dinh nghia partition scheme de co du dung luong SPIFFS
board_build.partitions = min_spiffs.csv

lib_deps =
    esphome/AsyncTCP
    ottowinter/ESPAsyncWebServer-esphome
    adafruit/Adafruit PWM Servo Driver Library

; Ghi chu: De upload web files len SPIFFS, dung lenh:
;   pio run -t uploadfs
; Truoc khi upload firmware equal Button Upload binh thuong.
