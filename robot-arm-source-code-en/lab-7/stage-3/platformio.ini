; ============================================================
; LAB 7 - STAGE 3
; Description: Web Send Advanced - WiFiManager, JSON Protocol, Pose Save
; Hardware: ESP32 DevKit V1 + PCA9685 + 6 Servo
; New features so voi STAGE 2:
;   - WiFiManager: cau hinh WiFi qua Captive Portal (no hardcode)
;   - Protocol WebSocket nang cap len JSON
;   - Pose Save/Load: Save toi da 5 pose vao NVS (Preferences)
;   - Auto-reconnect WebSocket tu phia JS client
; ============================================================

[env:esp32dev]
platform          = espressif32
board             = esp32dev
framework         = arduino
upload_speed      = 921600
monitor_speed     = 115200
upload_port       = COM9      ; <-- DOI THANH COM PORT THUC TE CUA BAN

board_build.partitions = min_spiffs.csv

lib_deps =
    esphome/AsyncTCP
    ottowinter/ESPAsyncWebServer-esphome
    adafruit/Adafruit PWM Servo Driver Library
    tzapu/WiFiManager                         ; Quan ly WiFi qua Captive Portal
    bblanchon/ArduinoJson                     ; Parse/Serialize JSON

; === HUONG DAN SU DUNG STAGE 3 ===
; First time use (chua co WiFi da Save):
;   1. ESP32 boot → start AP named "RobotArm-Config"
;   2. Connect phone/computer to this AP
;   3. Open browser → 192.168.4.1 → enter WiFi SSID and Password
;   4. ESP32 tu WiFi Connection va Save credentials vao flash
; Next time: ESP32 tu WiFi Connection ma khong can cau hinh lai.
; Reset credentials: giu Button BOOT (GPIO0) > 3 seconds khi boot.
